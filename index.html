</style></head><body><main class="shell"><header class="hero"><div class="eyebrow">✨ 작지만 든든한 컴퓨터 도우미</div><h1>모담의 <span>단축키 사전</span> ⌨️</h1><p>필요할 때 쏙 찾아보세요! 크고 귀여운 키로 쉽게 익혀요.</p><div class="searchrow"><input id="search" type="search" placeholder="예: 복사, 저장, 화면 캡처, Ctrl+C" aria-label="단축키 검색"><button id="clear" type="button">초기화</button></div></header><nav class="toolbar" aria-label="단축키 분류"><div class="tabs" id="tabs"></div><div class="options"><label for="os">표시 키보드</label><select id="os"><option value="win">Windows 키보드</option><option value="mac">Mac 키보드</option><option value="both">윈도우·맥 비교</option></select><button type="button" class="small-btn" id="print">🖨️ 인쇄</button></div></nav><div id="subnav" class="subnav" aria-label="구글 업무도구 프로그램 선택" hidden></div><aside class="hint"><div>💡 <strong id="hintTitle">단축키 사용법</strong> <span id="hintBody">키를 함께 누르세요. 예: Ctrl을 누른 상태에서 C를 한 번 누릅니다.</span></div><div class="legend" id="legend"></div></aside><section aria-label="단축키 목록"><div class="resultbar"><strong id="heading">⭐ 왕초보 필수</strong><span id="count"></span></div><div class="print-header">모담의 단축키 사전 · AI 강사 모담샘</div><div class="grid" id="grid"></div></section><footer class="foot">💙 AI 강사 모담샘</footer></main><div id="toast" class="toast" role="status"></div>

['화면 출력 모드 선택','Win+P',null,'노트북과 빔프로젝터·외부 모니터의 화면 표시 방식을 선택해요.','PC 화면만 · 복제(같은 화면) · 확장(서로 다른 작업 공간) · 두 번째 화면만 중에서 선택해요.'],
['창을 순서대로 전환','Alt+Esc',null,'열려 있는 창을 차례대로 앞으로 가져와요.','Alt+Tab과 달리 창 선택 목록을 띄우지 않아요.'],
['작업 보기','Win+Tab',null,'열려 있는 창과 가상 데스크톱을 한눈에 확인해요.'],
['새 가상 데스크톱','Win+Ctrl+D',null,'새로운 가상 작업 공간을 만들어요.'],
['이전 가상 데스크톱','Win+Ctrl+←',null,'왼쪽 가상 데스크톱으로 이동해요.','가상 데스크톱이 둘 이상일 때 사용해요.'],
['다음 가상 데스크톱','Win+Ctrl+→',null,'오른쪽 가상 데스크톱으로 이동해요.','가상 데스크톱이 둘 이상일 때 사용해요.'],

add('맥',[

function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,'').replace(/캡쳐|스크린샷|화면찍기|화면사진/g,'캡처').replace(/되돌리기/g,'실행취소').replace(/복붙/g,'복사')}

 let list=D.filter(d=>(state.cat==='전체'||state.cat==='즐겨찾기'||d.cat===state.cat)&&isAvailable(d)&&(state.cat!=='즐겨찾기'||state.favs.has(d.id))&&(state.cat!=='구글'||state.sub==='전체'||subcat(d)===state.sub)&&matches(d));

el('search').addEventListener('input',e=>{state.q=e.target.value;render()});
el('clear').addEventListener('click',()=>{state.q='';el('search').value='';state.cat='기초';state.sub='전체';render();el('search').focus()});
el('grid').addEventListener('click',e=>{let b=e.target.closest('[data-fav]');if(b){let id=Number(b.dataset.fav);if(state.favs.has(id))state.favs.delete(id);else state.favs.add(id);try{localStorage.setItem('modamShortcutFavoritesV1',JSON.stringify([...state.favs]))}catch{}render();toast(state.favs.has(id)?'즐겨찾기에 담았어요 💗':'즐겨찾기에서 뺐어요')}if(e.target.closest('#reset-empty')){state.q='';el('search').value='';state.cat='전체';render()}});
el('print').addEventListener('click',()=>window.print());render();
</script></body></html>
